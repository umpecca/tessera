name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  terminal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - run: npm ci
      - run: npm run verify:terminal-core
      - run: npm run build:web
      - run: git diff --exit-code -- web/vendor/terminal.js web/vendor/terminal-opus.js
      - run: node --test internal/terminalcore/core.test.mjs web/*.test.mjs scripts/*.test.mjs extensions/firefox-clipboard/bridge.test.mjs

  build:
    needs: terminal-core
    strategy:
      matrix:
        include:
          # - runner: ubuntu-latest
          #   goos: freebsd
          #   goarch: amd64
          #   cgo: "0"
          #   ext: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            ext: ""
            test: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
            ext: ""
            test: false
          # - runner: macos-15-intel
          #   goos: darwin
          #   goarch: amd64
          #   cgo: "1"
          #   ext: ""
          - runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""
            test: true
          - runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: ".exe"
            test: true
          # - runner: ubuntu-latest
          #   goos: openbsd
          #   goarch: amd64
          #   cgo: "0"
          #   ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        if: matrix.test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -ldflags "-s -w -X tessera/internal/version.Version=${{ github.ref_name }}" -o tessera-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/tessera

      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tessera-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Build terminal audio helper
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o tessera-audio-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/tessera-audio

      - uses: actions/upload-artifact@v4
        with:
          name: tessera-audio-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tessera-audio-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  installer-test:
    needs: terminal-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ubuntu installer
        run: |
          bash -n scripts/install-ubuntu.sh
          bash -n scripts/install-ubuntu.test.sh
          bash scripts/install-ubuntu.test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
