name: CI and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Builds every generated file from source: the terminal core, the browser
  # bundles and the clipboard extension package. The release binaries embed
  # these, not the committed copies, and the committed copies must match, so
  # a checkout always builds what was released.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - run: npm ci
      - run: npm run build:terminal-core
      - run: npm run build:web

      - name: Committed generated files match the build
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: JavaScript tests
        run: node --test $(find . -name "*.test.mjs" -not -path "*/node_modules/*" -not -path "./.cache/*")

      - uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: |
            internal/terminalcore/ghostty-vt.wasm
            web/vendor/
            web/extensions/
          if-no-files-found: error

  build:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # - runner: ubuntu-latest
          #   goos: freebsd
          #   goarch: amd64
          #   cgo: "0"
          #   ext: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            ext: ""
            test: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
            ext: ""
            test: true
          # - runner: macos-15-intel
          #   goos: darwin
          #   goarch: amd64
          #   cgo: "1"
          #   ext: ""
          - runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""
            test: true
          - runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: ".exe"
            test: true
          # - runner: ubuntu-latest
          #   goos: openbsd
          #   goarch: amd64
          #   cgo: "0"
          #   ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The files the assets job built, over the checkout's copies.
      - uses: actions/download-artifact@v4
        with:
          name: generated-assets
          path: .

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        if: matrix.test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -ldflags "-s -w -X tessera/internal/version.Version=${{ github.ref_name }}" -o tessera-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/tessera

      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tessera-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  installer-test:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ubuntu installer
        run: |
          bash -n scripts/install-ubuntu.sh
          bash -n scripts/install-ubuntu.test.sh
          bash scripts/install-ubuntu.test.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          pattern: tessera-*
          path: dist
          merge-multiple: true

      - name: Verify all Tessera binaries
        run: node scripts/verify-release-assets.mjs dist

      - name: Preserve assets required by pre-v1.9.1 updaters
        run: node scripts/prepare-legacy-update-assets.mjs dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
